[package]
name = "wonderd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wonderd"
path = "src/main.rs"

# Experimental headless host CLI (`wonder`) for Linux and Windows; not part of the Mac companion.
[[bin]]
name = "cupola"
path = "src/headless/main.rs"
required-features = ["experimental-headless"]

[features]
# Isolated SSH research harness only; the module also requires debug assertions.
diagnostics-ssh-spike = []
diagnostics-input-timing = []
experimental-headless = ["dep:qrcode", "dep:clap"]
# `wonder pair --yes/--watch-stdin` approves the first phone without a person
# comparing the verification text. Never enabled for released packages;
# scripts/pair-device builds local and VM test CLIs with it. The separate
# physical-host-control check uses an already-running, already-paired host.
dev-pairing = ["experimental-headless"]

[dependencies]
dunce = "1.0.5"
flate2 = "1.1.10"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
base64.workspace = true
hex.workspace = true
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
memchr = "2"
zeroize = "1"
time.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tempfile.workspace = true
uuid.workspace = true
wonder-api = { path = "../wonder-api" }
wonder-app-server = { path = "../wonder-app-server" }
wonder-store = { path = "../wonder-store" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"], optional = true }

jsonschema = { version = "0.53.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29.0"
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
tower.workspace = true
# Home network route: TLS listener pinned to the host key (lan.rs).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# EXPERIMENTAL Windows host.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_UI_Shell",
] }

[dev-dependencies]
p256.workspace = true
wonder-app-server = { path = "../wonder-app-server", features = ["test-support"] }
wonder-store = { path = "../wonder-store", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
